# Proves, on clean machines, that the code installs and runs as documented: on Linux and on Windows (the owner's platform).
# Nothing here uses a secret. The AI-company check uses a stand-in `claude` program, never a real account.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: FFmpeg (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 12
        shell: bash
        run: |
          # the runner's package mirror occasionally stalls; bound each attempt and retry instead of hanging the job
          for attempt in 1 2 3; do
            if timeout 240 sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update \
               && timeout 300 sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y ffmpeg; then
              exit 0
            fi
            echo "attempt $attempt failed; retrying"; sleep 10
          done
          exit 1
      - name: FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check app tests migrations
      - name: Tests
        run: python -m pytest -n 4 -o addopts="" -v --timeout=240 --durations=15 -p no:cacheprovider

  frontend:
    name: Dashboard build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build
        run: npm run build

  real-processes:
    name: Real API + worker processes (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: FFmpeg (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 12
        shell: bash
        run: |
          # the runner's package mirror occasionally stalls; bound each attempt and retry instead of hanging the job
          for attempt in 1 2 3; do
            if timeout 240 sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update \
               && timeout 300 sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y ffmpeg; then
              exit 0
            fi
            echo "attempt $attempt failed; retrying"; sleep 10
          done
          exit 1
      - name: FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      - name: Install
        run: python -m pip install -e "backend[dev]"
      - name: Restart survival (real processes)
        run: python scripts/verify_restart.py
      - name: The AI company end to end (real processes, stand-in claude)
        run: python scripts/verify_ai_stack.py

  windows-install:
    name: Windows installer (scripts/windows/setup.ps1)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run the installer exactly as the owner would
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File scripts\windows\setup.ps1
      - name: Prerequisite check
        run: python launcher.py --check
